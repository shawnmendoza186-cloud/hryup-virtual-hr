<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HRyUp Client Dashboard</title><link rel="stylesheet" href="/style.css"></head><body class="dashboard"><header class="dashnav"><a class="brand" href="/"><span class="brand-mark">HR</span><span>HR<span>y</span>Up</span></a><button class="btn outline" onclick="logout()">Log out</button></header><main class="dashmain"><div class="welcome"><div><div class="eyebrow">CLIENT DASHBOARD</div><h1>Hello, <span id="user-name">Client</span>.</h1><div class="muted" id="business-name"></div></div><button class="btn" onclick="document.getElementById('request-panel').scrollIntoView({behavior:'smooth'})">New HR Request +</button></div><div class="stats"><div class="stat"><small class="muted">Total requests</small><strong id="total">0</strong></div><div class="stat"><small class="muted">Received</small><strong id="received">0</strong></div><div class="stat"><small class="muted">In progress</small><strong id="progress">0</strong></div><div class="stat"><small class="muted">Completed</small><strong id="completed">0</strong></div></div><div class="request-grid"><section class="panel" id="request-panel"><h2>Submit an HR request</h2><p class="muted">Tell HRyUp what support your business needs.</p><form onsubmit="submitRequest(event)"><div class="field"><label>Service</label><select name="service" required><option value="Recruitment Assistance">Recruitment Assistance</option><option value="Employee Records / 201 Files">Employee Records / 201 Files</option><option value="Onboarding Support">Onboarding Support</option><option value="Attendance and Leave">Attendance and Leave</option><option value="HR Helpdesk">HR Helpdesk</option><option value="Performance Support">Performance Support</option><option value="HR Consultation">HR Consultation</option></select></div><div class="field"><label>Subject</label><input name="subject" placeholder="e.g. Need help screening applicants" required></div><div class="field"><label>Priority</label><select name="priority"><option>Normal</option><option>Urgent</option></select></div><div class="field"><label>Details</label><textarea name="details" rows="5" placeholder="Describe what you need help with..." required></textarea></div><div id="request-msg"></div><button class="btn full">Submit Request</button></form></section><section class="panel"><h2>My HR requests</h2><div id="requests"></div></section></div></main><script src="/app.js"></script><script>if(!token)location.href='/';else loadDashboard()</script></body></html>
